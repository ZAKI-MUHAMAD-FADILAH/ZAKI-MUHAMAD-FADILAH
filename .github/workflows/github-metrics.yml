name: Update GitHub Engineering Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=ZAKI-MUHAMAD-FADILAH
            &show_icons=true
            &include_all_commits=true
            &role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
            &theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=ZAKI-MUHAMAD-FADILAH
            &layout=compact
            &langs_count=10
            &role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
            &size_weight=0.5
            &count_weight=0.5
            &theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No metrics changes."
            exit 0
          fi

          git commit -m "chore: update GitHub engineering metrics"
          git push
