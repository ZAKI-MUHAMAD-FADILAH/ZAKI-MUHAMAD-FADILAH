name: Update GitHub Engineering Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 1. VALIDATE PAT
      # -------------------------------------------------------
      - name: Validate GitHub PAT
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          set -euo pipefail

          echo "Checking GitHub authentication..."

          LOGIN=$(curl -fsSL \
            -H "Authorization: Bearer ${STATS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user | jq -r '.login')

          if [ "$LOGIN" != "ZAKI-MUHAMAD-FADILAH" ]; then
            echo "Token authenticated as unexpected user: $LOGIN"
            exit 1
          fi

          echo "PAT authentication OK"
          echo "Authenticated user: $LOGIN"

      # -------------------------------------------------------
      # 2. TEST PRIVATE REPOSITORY ACCESS
      # -------------------------------------------------------
      - name: Validate Repository Access
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          set -euo pipefail

          TOTAL=$(curl -fsSL \
            -H "Authorization: Bearer ${STATS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/repos?visibility=all&affiliation=owner,collaborator,organization_member&per_page=100" \
            | jq 'length')

          echo "Repositories accessible on first page: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "Token cannot access repositories."
            exit 1
          fi

      # -------------------------------------------------------
      # 3. GENERATE BASE STATS FIRST
      # -------------------------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=ZAKI-MUHAMAD-FADILAH
            &show_icons=true
            &theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      # -------------------------------------------------------
      # 4. GENERATE ALL-REPO TOP LANGUAGES
      # -------------------------------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=ZAKI-MUHAMAD-FADILAH
            &layout=compact
            &langs_count=10
            &role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
            &size_weight=0.5
            &count_weight=0.5
            &theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      # -------------------------------------------------------
      # 5. COMMIT GENERATED CARDS
      # -------------------------------------------------------
      - name: Commit generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No metrics changes."
            exit 0
          fi

          git commit -m "chore: update GitHub engineering metrics"
          git push
